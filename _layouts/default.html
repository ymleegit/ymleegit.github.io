<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | 내 연구 리포지토리</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 수식 렌더링 -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- GSAP 애니메이션 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- 💡 3D 단백질 렌더링을 위한 라이브러리 (jQuery + 3Dmol) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://3dmol.org/build/3Dmol-min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <nav class="max-w-5xl mx-auto px-6 py-6 flex justify-between items-center border-b border-gray-200">
        <a href="/" class="text-xl font-bold tracking-tight text-gray-950">AI-Bio.Archive</a>
        <div class="space-x-6 text-sm font-medium text-gray-600">
            <a href="/" class="hover:text-blue-600">About</a>
            <a href="/#papers" class="hover:text-blue-600">Paper Notes</a>
            <a href="/#contact" class="hover:text-blue-600">Contact</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">
        {{ content }}
    </main>

    <footer id="contact" class="bg-gray-950 text-gray-400 py-12 mt-24">
        <div class="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h3 class="text-white text-lg font-bold mb-4">Contact</h3>
                <p class="text-sm leading-relaxed">언제든 연구 관련 논의나 질문은 환영합니다.</p>
                <p class="mt-4 text-white font-medium text-sm">Email: my-email@domain.com</p>
            </div>
            <div class="text-sm md:text-right flex flex-col justify-end">
                <p>© 2026 My Name. Powered by GitHub Pages.</p>
            </div>
        </div>
    </footer>

    <!-- 💡 GSAP 스크롤 애니메이션 고도화 스크립트 -->
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // --- 발전된 효과 1: 스크롤 속도에 맞춰 페이드인 -> 유지 -> 페이드아웃 되는 타임라인 ---
        gsap.utils.toArray('.reveal').forEach(elem => {
            gsap.timeline({
                scrollTrigger: {
                    trigger: elem,
                    start: "top 85%",    // 화면 아래에서 85% 지점에 올 때 페이드인 시작
                    end: "bottom 15%",   // 화면 위쪽 15% 지점을 빠져나갈 때 페이드아웃 끝
                    scrub: 0.5,          // 💡 가만히 있으면 안 움직이고, '스크롤할 때만' 부드럽게 반응하게 만듦
                }
            })
            .fromTo(elem, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2 }) // 등장
            .to(elem, { opacity: 1, duration: 0.6 })                                  // 화면 중간에선 선명하게 유지
            .to(elem, { opacity: 0, y: -30, duration: 0.2 });                         // 위로 스크롤되어 나갈 때 사라짐
        });
    </script>

</body>
</html>
