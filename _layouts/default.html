<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | 내 연구 리포지토리</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://3dmol.org/build/3Dmol-min.js"></script>
</head>
<body class="bg-black text-white font-sans antialiased">

    <nav class="max-w-5xl mx-auto px-6 py-6 flex justify-between items-center border-b border-gray-900">
        <a href="/" class="text-xl font-bold tracking-tight text-white">AI-Bio.Archive</a>
        <div class="space-x-6 text-sm font-medium text-gray-400">
            <a href="/" class="hover:text-blue-400">About</a>
            <a href="/#papers" class="hover:text-blue-400">Paper Notes</a>
            <a href="/#contact" class="hover:text-blue-400">Contact</a>
        </div>
    </nav>

    <main class="w-full">
        {{ content }}
    </main>

    <footer id="contact" class="bg-gray-950 text-gray-400 py-12 mt-24 border-t border-gray-900">
        <div class="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h3 class="text-white text-lg font-bold mb-4">Contact</h3>
                <p class="text-sm leading-relaxed">언제든 연구 관련 논의나 질문은 환영합니다.</p>
                <p class="mt-4 text-white font-medium text-sm">Email: my-email@domain.com</p>
            </div>
            <div class="text-sm md:text-right flex flex-col justify-end">
                <p>© 2026 My Name. Powered by GitHub Pages.</p>
            </div>
        </div>
    </footer>

</body>
</html>
