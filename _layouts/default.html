<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | 내 연구 리포지토리</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <nav class="max-w-5xl mx-auto px-6 py-6 flex justify-between items-center border-b border-gray-200">
        <a href="/" class="text-xl font-bold tracking-tight text-gray-950">AI-Bio.Archive</a>
        <div class="space-x-6 text-sm font-medium text-gray-600">
            <a href="/" class="hover:text-blue-600">About</a>
            <a href="/#papers" class="hover:text-blue-600">Paper Notes</a>
            <a href="/#contact" class="hover:text-blue-600">Contact</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">
        {{ content }}
    </main>

    <footer id="contact" class="bg-gray-950 text-gray-400 py-12 mt-24">
        <div class="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h3 class="text-white text-lg font-bold mb-4">Contact</h3>
                <p class="text-sm leading-relaxed">언제든 연구 관련 논의나 질문은 환영합니다.</p>
                <p class="mt-4 text-white font-medium text-sm">Email: my-email@domain.com</p>
            </div>
            <div class="text-sm md:text-right flex flex-col justify-end">
                <p>© 2026 My Name. Powered by GitHub Pages.</p>
            </div>
        </div>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        // --- 효과 1: 텍스트 페이드인/아웃 (.reveal) ---
        // 'reveal' 클래스를 가진 모든 요소를 찾아서 처리
        gsap.utils.toArray('.reveal').forEach(elem => {
            gsap.to(elem, {
                x: 0, 
                y: 0,          // 원래 위치로
                opacity: 1,    // 선명하게
                duration: 1,   // 1초 동안 실행
                ease: "power2.out", // 부드러운 감속 효과
                
                // 스크롤 연동 설정
                scrollTrigger: {
                    trigger: elem,      // 이 요소가 화면에 보이면 시작
                    start: "top 85%",   // 요소의 맨 위가 화면 아래에서 85% 지점에 도달했을 때
                    end: "bottom 20%",  // 요소의 맨 아래가 화면 위에서 20% 지점에 도달했을 때
                    toggleActions: "play reverse play reverse", // 들어올 때 재생, 나갈 때 반전 (페이드아웃)
                    // markers: true, // 💡 개발할 때 주석 해제하면 스크롤 시작/끝 지점이 눈으로 보입니다.
                }
            });
        });

        // --- 효과 2: 그림 흩어졌다가 모이기 (.scatter-img) ---
        // 트리거는 부모 컨테이너로 지정
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".scatter-container",
                start: "top 70%",   // 컨테이너가 화면 중간쯤 오면 시작
                end: "bottom 30%",
                scrub: 1,          // 💡 핵심: 스크롤 속도에 맞춰 애니메이션이 전진/후진함
                // markers: true,
            }
        });

        // 컨테이너 내의 .scatter-img 들을 한꺼번에 제어
        // 초기 상태(HTML에 적은 opacity-0, scale-50)에서 아래 상태로 움직임
        tl.to(".scatter-img", {
            opacity: 1,         // 선명해지고
            scale: 1,           // 커지면서
            
            // 핵심: 각 이미지별로 다른 최종 위치값을 부여하여 '모이는' 느낌을 줌
            x: (i) => [-150, 0, 150][i], // 1번이미지는 왼쪽-150px에서 중앙으로, 2번은중앙, 3번은오른쪽150px에서 중앙으로
            y: (i) => [50, -50, 80][i],   // 위아래로도 살짝 흩었다 모음
            
            duration: 1,
            ease: "none",        // scrub 모드에선 none이 자연스러움
            stagger: 0.1         // 0.1초 간격으로 순서대로 애니메이션 시작 (더 흩어지는 느낌)
        });
    </script>

</body>
</html>
